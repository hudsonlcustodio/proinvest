<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>ProInvest Crypto Spot</title><h1>Holding Cripto — CRYPTO_SPOT@1</h1><form id="f"><label>Strategy<select id="s"></select></label><label>Account<select id="a"></select></label><label>Instrument<select id="i"></select></label><label>Quantidade BTC<input id="q" value="0.00031"></label><label>Preço unitário USD/BTC<input id="p" value="63000.38"></label><label>Data<input id="d" type="date" value="2026-02-01"></label><button type="button" id="preview">Preview</button><button>Save / Reload</button></form><section id="out" aria-live="polite"></section><script>const $=x=>document.getElementById(x),api=(u,o)=>fetch(u,o).then(async r=>{const b=await r.json();if(!r.ok)throw Error(b.code||r.status);return b});async function init(){const[s,a,i]=await Promise.all(['/v1/strategies','/v1/strategies/accounts','/v1/strategies/instruments'].map(api));s.items.filter(x=>x.templateType==='CRYPTO_SPOT').forEach(x=>$('s').add(new Option(x.name,x.id)));a.items.forEach(x=>$('a').add(new Option(x.name,x.id)));i.items.filter(x=>x.symbol==='BTC').forEach(x=>$('i').add(new Option(x.symbol,x.id)))}function body(){return{strategyId:$('s').value,accountId:$('a').value,instrumentId:$('i').value,side:'BUY',quantity:$('q').value,unitPrice:$('p').value,currency:'USD',openedAt:$('d').value+'T10:00:00.000Z',template:{type:'CRYPTO_SPOT',version:1}}}function render(metrics,title){$('out').textContent=`${title}\n${$('q').value} BTC\n${$('p').value} USD/BTC\nGross amount: ${metrics.grossAmount?.value??metrics.costBasis?.value} USD\nMarket value: Indisponível\nUnrealized P&L: Indisponível`}async function send(path,extra={}){return api(path,{method:'POST',headers:{'content-type':'application/json',...extra},body:JSON.stringify(body())})}$('preview').onclick=()=>send('/v1/operations/preview').then(x=>render(x.metrics,'Preview')).catch(e=>$('out').textContent=e.message);$('f').onsubmit=async e=>{e.preventDefault();try{const saved=await send('/v1/operations',{'Idempotency-Key':crypto.randomUUID()});await api('/v1/operations/'+saved.id);const p=body(),position=await api('/v1/operations/position/'+p.accountId+'/'+p.instrumentId);render(position,'Salvo e recarregado')}catch(error){$('out').textContent=error.message}};init().catch(e=>$('out').textContent=e.message)</script>
