<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProInvest DeFi LP</title><style>body{font:16px system-ui;max-width:760px;margin:32px auto;padding:0 16px;color:#17202a}form{display:grid;gap:12px;max-width:520px}label{display:grid;gap:4px}input,select,button{font:inherit;padding:9px}button{cursor:pointer;background:#173b57;color:white;border:0;border-radius:4px}.card{padding:16px;background:#f2f5f7;border-radius:6px;margin-top:20px;white-space:pre-wrap}</style><body><h1>Pool de Liquidez — DEFI_LP@1</h1><form id="f"><label>Strategy<select id="s"></select></label><label>Account<select id="a"></select></label><label>Par<select id="pair"></select></label><label>Valor investido USD<input id="invested" value="450.31"></label><label>Data de entrada<input id="opened" type="date" value="2026-07-28"></label><label>Valor atual da posição USD<input id="current" value="428.12"></label><label>Fees não reivindicados USD<input id="fees" value="36.22"></label><label>Data da observação<input id="observed" type="date" value="2026-08-28"></label><button type="button" id="preview">Preview</button><button>Save / Reload</button></form><div id="out" class="card" aria-live="polite"></div><script>const $=x=>document.getElementById(x),api=(u,o)=>fetch(u,o).then(async r=>{const b=await r.json();if(!r.ok)throw Error(b.code||r.status);return b});let refs=[];async function init(){const[s,a,i]=await Promise.all(['/v1/strategies','/v1/strategies/accounts','/v1/strategies/instruments'].map(api));s.items.filter(x=>x.templateType==='DEFI_LP').forEach(x=>$('s').add(new Option(x.name+' ('+x.code+')',x.id)));a.items.forEach(x=>$('a').add(new Option(x.name,x.id)));refs=i.items;const w=refs.find(x=>x.symbol==='WBTC'),sol=refs.find(x=>x.symbol==='SOL');if(w&&sol)$('pair').add(new Option('WBTC / SOL',w.id+','+sol.id))}function operation(){const ids=$('pair').value.split(',');return{strategyId:$('s').value,accountId:$('a').value,componentInstrumentIds:ids,investedAmount:$('invested').value,currency:'USD',openedAt:$('opened').value+'T10:00:00.000Z',template:{type:'DEFI_LP',version:1}}}function snapshot(){return{currentPositionValue:$('current').value,unclaimedFees:$('fees').value,currency:'USD',observedAt:$('observed').value+'T12:00:00.000Z'}}function render(m,t){$('out').textContent=t+'\nInvestido: '+$('invested').value+' USD\nValor atual da posição: '+$('current').value+' USD\nFees não reivindicados: '+$('fees').value+' USD\nVariação da posição: '+m.positionValueDelta.value+' USD\nValor econômico: '+(m.economicValue.value??'Indisponível')+' USD\nP&L total: '+(m.totalPnl.value??'Indisponível')+' USD\nRetorno total: '+(m.totalReturn.value??'Indisponível')+'\nAPR: Indisponível\nAPY: Indisponível\nImpermanent Loss: Indisponível'}$('preview').onclick=()=>api('/v1/operations/preview',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...operation(),...snapshot()})}).then(x=>render(x.metrics,'Preview')).catch(e=>$('out').textContent=e.message);$('f').onsubmit=async e=>{e.preventDefault();try{const op=operation(),saved=await api('/v1/operations',{method:'POST',headers:{'content-type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify(op)});await api('/v1/operations/'+saved.id+'/snapshots',{method:'POST',headers:{'content-type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify(snapshot())});const latest=await api('/v1/operations/'+saved.id+'/metrics');render(latest.metrics,'Salvo e recarregado')}catch(error){$('out').textContent=error.message}};init().catch(e=>$('out').textContent=e.message)</script>
