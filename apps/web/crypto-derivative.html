<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProInvest Crypto Derivative</title><style>body{font:16px system-ui;max-width:760px;margin:32px auto;padding:0 16px;color:#17202a}form{display:grid;gap:12px;max-width:520px}label{display:grid;gap:4px}input,select,button{font:inherit;padding:9px}button{cursor:pointer;background:#173b57;color:white;border:0;border-radius:4px}.card{padding:16px;background:#f2f5f7;border-radius:6px;margin-top:20px;white-space:pre-wrap}</style><body><h1>Alavancagem Cripto — CRYPTO_DERIVATIVE@1</h1><form id="f"><label>Strategy<select id="s"></select></label><label>Account<select id="a"></select></label><label>Instrument<select id="i"></select></label><label>Side<select id="side"><option>SELL</option><option>BUY</option></select></label><label>Capital investido<input id="c" value="100.00"></label><label>Alavancagem<input id="l" value="50"></label><label>Entry price<input id="e" value="69358.32"></label><label>Exit price<input id="x" value="59862.15"></label><label>Data de abertura<input id="o" type="date" value="2026-04-02"></label><label>Data de fechamento<input id="d" type="date" value="2026-04-02"></label><button type="button" id="preview">Preview</button><button>Save / Reload</button></form><div id="out" class="card" aria-live="polite"></div><script>const $=x=>document.getElementById(x),api=(u,o)=>fetch(u,o).then(async r=>{const b=await r.json();if(!r.ok)throw Error(b.code||r.status);return b});async function init(){const[s,a,i]=await Promise.all(['/v1/strategies','/v1/strategies/accounts','/v1/strategies/instruments'].map(api));s.items.filter(x=>x.templateType==='CRYPTO_DERIVATIVE').forEach(x=>$('s').add(new Option(x.name+' ('+x.code+')',x.id)));a.items.forEach(x=>$('a').add(new Option(x.name,x.id)));i.items.filter(x=>x.symbol==='BTC').forEach(x=>$('i').add(new Option(x.symbol,x.id)))}function body(){return{strategyId:$('s').value,accountId:$('a').value,instrumentId:$('i').value,side:$('side').value,investedCapital:$('c').value,leverage:$('l').value,entryPrice:$('e').value,exitPrice:$('x').value,currency:'USD',openedAt:$('o').value+'T10:00:00.000Z',closedAt:$('d').value+'T11:00:00.000Z',template:{type:'CRYPTO_DERIVATIVE',version:1}}}function render(m,t){$('out').textContent=t+'\nCapital investido: '+m.effectiveNotional.currency+' '+$('c').value+'\nAlavancagem: '+$('l').value+'x\nExposição efetiva: '+m.effectiveNotional.value+' USD\nMovimento: '+m.priceMove+' USD\nRetorno do ativo: '+m.underlyingReturn+'\nRetorno alavancado: '+m.leveragedReturn+'\nP&L bruto (canônico): '+m.grossPnl.value+' USD\nP&L líquido: Indisponível — custos/funding não informados'}function send(path,extra={}){return api(path,{method:'POST',headers:{'content-type':'application/json',...extra},body:JSON.stringify(body())})}$('preview').onclick=()=>send('/v1/operations/preview').then(x=>render(x.metrics,'Preview')).catch(e=>$('out').textContent=e.message);$('f').onsubmit=async e=>{e.preventDefault();try{const saved=await send('/v1/operations',{'Idempotency-Key':crypto.randomUUID()}),reloaded=await api('/v1/operations/'+saved.id);render(saved.metrics,'Salvo e recarregado\n'+JSON.stringify(reloaded,null,2))}catch(error){$('out').textContent=error.message}};init().catch(e=>$('out').textContent=e.message)</script>
