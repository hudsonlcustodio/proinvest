name: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: proinvest
          POSTGRES_PASSWORD: proinvest
          POSTGRES_DB: proinvest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proinvest -d proinvest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://proinvest:proinvest@localhost:5432/proinvest_test
      TEST_DATABASE_URL: postgresql://proinvest:proinvest@localhost:5432/proinvest_test

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Full PostgreSQL regression (zero skips)
        run: |
          set -o pipefail
          npm test | tee test-output.log
          grep -q 'ℹ skipped 0' test-output.log
      - run: npm run test:web
      - run: npx playwright install --with-deps chromium
      - name: Create isolated browser QA database
        run: node scripts/create-browser-test-db.mjs
      - name: Migrate isolated browser QA database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://proinvest:proinvest@localhost:5432/proinvest_browser
      - name: Seed isolated browser QA database
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://proinvest:proinvest@localhost:5432/proinvest_browser
      - name: Real Chromium QA (desktop and mobile)
        run: npm run test:browser
        env:
          DATABASE_URL: postgresql://proinvest:proinvest@localhost:5432/proinvest_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            test-results
            playwright-report
          retention-days: 14
      - run: npm audit --audit-level=high
